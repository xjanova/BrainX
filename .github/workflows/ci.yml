name: CI

# Does it compile, and do the checks pass? That is the whole job.
#
# build-and-release.yml only fires on push to main, which means a pull request
# had NO build at all: the first time anything got compiled was after it was
# merged, on the branch that publishes releases. A compile error found there
# costs a red release build and a revert; found here it costs a re-push.
#
# Deliberately NOT the release pipeline. That one publishes three
# self-contained runtimes and packs a Velopack installer — minutes of work to
# answer a question the compiler answers in seconds. Release stays the only
# thing that builds release artifacts; this is only the gate in front of it.
#
# And the gate INSIDE it: build-and-release.yml calls this file (workflow_call)
# and publishes nothing unless it passes on the commit being released. A PR is
# not the only way into main — on 2026-09-23 main was pushed to directly, and
# v2.0.408 reached every installed client with no check run on GitHub at all.
on:
  # pull_request ONLY, and the omission is the point. The first version also
  # had `push: branches-ignore: [main]`, which looked like it covered branches
  # nobody had opened a PR for yet — what it actually did was run this workflow
  # TWICE on every PR branch, once for the push and once for the PR, burning
  # two windows runners to answer one question. Observed on PR #2: two `build`
  # check runs, same commit, same result.
  #
  # A branch with no PR gets no CI of its own. What it can no longer do is
  # release untested: main is one `git push` away without any PR, so the
  # release pipeline runs this file itself (workflow_call, below).
  pull_request:
  # For a branch you want compiled before opening the PR.
  workflow_dispatch:
  # build-and-release.yml's `test` job. Not the same question asked twice: a
  # PR's check ran on its merge preview, and main can move after that — or be
  # pushed to with no PR at all. This run is about the commit being published.
  workflow_call:

# A second push supersedes the first: the older run is answering a question
# about code that no longer exists.
#
# github.workflow is in the key for the CALLED run, where every github.* value
# is the caller's: its group is "ci-Build and Release-refs/heads/main", so a CI
# dispatched by hand on main cannot cancel the gate in front of a release. And
# it can never equal the caller's own "release-…" group — a called workflow
# that shares its caller's group is cancelled as a deadlock.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The harness runs whatever the branch contains, and reading is all it needs.
# Called from the release pipeline it would otherwise hold that run's write
# grant — the one that tags and publishes.
permissions:
  contents: read

jobs:
  # No `if:` on this job or its steps. In the called run github.event_name is
  # the caller's (push / workflow_dispatch), so a condition written with pull
  # requests in mind would quietly decide whether releases are tested at all.
  build:
    # windows-latest is not a preference. BrainX.Client is WPF and does not
    # compile anywhere else, and the solution builds as one unit.
    runs-on: windows-latest
    # The whole job took 3.5 minutes on 2026-09-23 (harness 484 checks: 72 s).
    # Without a limit a hung harness holds the runner — and the release
    # waiting on it — for GitHub's default six hours before anyone hears.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # BrainX.Mcp.csproj derives its version from `git rev-list --count
          # HEAD`. A shallow clone makes that count wrong (and on some runners,
          # fail), so the build would stamp a version nobody can compare.
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore BrainX.slnx

      - name: Build
        run: dotnet build BrainX.slnx -c Release --no-restore

      # The harness spawns ITSELF as a stub MCP child, so it has to be the
      # built executable — `dotnet run` puts the SDK's host in the middle and
      # the harness refuses to run that way (see BrainX.Tests/Program.cs).
      - name: Verification harness
        run: .\BrainX.Tests\bin\Release\net10.0\BrainX.Tests.exe

      # The HUD is plain ES modules loaded straight into WebView2 — no bundler,
      # so nothing else would ever catch a syntax error in them. A broken
      # module does not degrade one panel, it stops the file parsing and takes
      # the entire HUD dark (which has happened once already, see the note in
      # hud.js about a redeclared `esc`).
      - name: Parse HUD modules
        shell: bash
        run: |
          fail=0
          for f in BrainX.Client/wwwroot/universe/*.js; do
            if node --input-type=module --check < "$f"; then
              echo "ok   $f"
            else
              echo "FAIL $f"
              fail=1
            fi
          done
          exit $fail

      # Where placed HUD cards go when the window changes shape. hudplace.js is
      # pure geometry, so its rules run here without a browser: no overlaps,
      # nothing out of the gutters, columns kept straight, the owner's own
      # arrangement exact at the size it was made.
      - name: HUD placement rules
        run: node BrainX.Tests/hud/hudplace.check.mjs
