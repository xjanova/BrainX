<!DOCTYPE html>
<!--
  The cowork room.

  Owner (2026-09-19): "ให้มีพื้นที่ที่ฉันรู้ว่าพวกคุณสื่อสารอะไรกัน ... เหมือนเป็น
  cowork space ไม่ว่าจะเชื่อมต่อกับใครก็คุยกันในนั้น เหมือนห้องทำงานไง ... ฉันเข้าไป
  พิมพ์ ทุกคนต้องฟัง ตรงนั้น เหมือนบอสเข้าไปสั่งการ เรียกงานดู".

  Every agent that has ever connected to this brain gets a desk. The room is
  the bus, drawn: presence decides whether anyone is sitting there, the tool
  counter decides whether they are typing, and every message that crosses is a
  bubble travelling from one desk to another. Nothing here is decoration for
  its own sake — each thing that moves is a fact from disk that was previously
  only legible as a number on a card.

  The room renders on a canvas at a small internal resolution and is scaled up
  with smoothing off, so it is genuinely pixel art rather than a blurred vector
  drawing. Text is HTML positioned over the canvas: a pixel font small enough
  to fit the scene would be unreadable, and the owner has to be able to read
  what the agents said.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BrainX — Cowork Room</title>
<link rel="stylesheet" href="office.css">
</head>
<body>
  <div id="room">
    <canvas id="floor" aria-label="The office, drawn from who is connected"></canvas>
    <!-- Name plates, speech bubbles and status chips ride above the canvas so
         they stay crisp at any scale. office.js positions them from the same
         isometric projection the canvas draws with. -->
    <div id="overlay"></div>

    <div id="room-head">
      <span class="dot" id="room-dot"></span>
      <strong>COWORK ROOM</strong>
      <span id="room-sub">—</span>
      <!-- The boss, as a switch. The broker is what reads this room and starts
           whoever should be working; showing it here is the difference between
           "nobody answered" and "nothing was ever going to". Clicking asks the
           CLIENT to start or stop it — the page cannot, and must not, run a
           process that spawns agents. -->
      <button id="room-broker" type="button" title="บอสจัดสรรงาน (broker)">—</button>
      <!-- The Windows Service the boss used to have. Retired 2026-09-21: it ran
           as SYSTEM, which cannot reach the owner's agents. The chip stays so an
           install left over from before is visible, and removable. -->
      <button id="room-service" type="button" aria-expanded="false" aria-controls="service-panel"
              title="Windows Service ของบอส — ติดตั้ง / สิทธิ์ / สั่งงาน">service</button>
      <!-- The map the room runs on. Opened in this same WebView so the plate
           loads from the same virtual host the room uses; painting it is how
           the walkable floor, the blocked furniture and the occluders are
           defined, instead of being measured off the picture by eye. -->
      <button id="room-map" type="button" title="ระบายผังห้อง — เดินได้ / ห้ามเข้า / ต้องบัง">ผังห้อง</button>
      <!-- The light. Dark means nobody is seated, nothing is announced and
           nobody is called in — the stop that keeps a circle of agents from
           talking until the tokens run out. -->
      <button id="room-light" type="button" title="ไฟห้อง — ปิดแล้วทุกคนออก ไม่มีใครคุยได้จนกว่าจะเปิดใหม่">💡</button>
    </div>

    <section id="service-panel" hidden aria-label="Windows Service ของบอส">
      <header>Windows Service <span>— แบบเก่า เลิกใช้แล้ว</span></header>
      <dl id="service-facts"></dl>
      <ul id="service-warn"></ul>
      <div id="service-actions"></div>
      <p id="service-note"></p>
    </section>
  </div>

  <aside id="side">
    <header id="side-head">
      <strong>ห้องทำงาน</strong>
      <span id="side-count">—</span>
    </header>

    <!-- Questions the agents have stopped on. Above the transcript on purpose:
         the whole loop is parked until one of these is answered, so it must not
         be something the owner has to scroll back to find. -->
    <ol id="decisions" aria-label="Waiting on you"></ol>

    <!-- The board: who is doing what. Built from the task files the agents
         write with cowork_task, so an assignment is something the owner can
         look at, not a sentence to find in the transcript. -->
    <section id="board" hidden aria-label="Who is doing what">
      <header id="board-head"><strong>บอร์ดงาน</strong><span id="board-sum"></span></header>
      <ol id="board-list"></ol>
    </section>

    <ol id="log" aria-label="What the agents said"></ol>

    <!-- Who the next line is for. A chip adds "@name" to the line; no chip
         means the whole room. -->
    <div id="say-to" aria-label="ส่งถึงใคร"></div>
    <form id="say" autocomplete="off">
      <input id="say-text" type="text" maxlength="4000"
             placeholder="สั่งงาน — ใส่ @ชื่อ เพื่อสั่งเจาะจงคน ไม่ใส่ = ทุกคนในห้อง">
      <button type="submit" id="say-send" title="ส่งเข้าห้อง">ส่ง</button>
    </form>
  </aside>

  <!-- The room's rules (walkable floor, solid furniture, what stands in front
       of whom, and the places worth walking to) before the room itself: a
       classic script, so office.js can just use them. -->
  <script src="roommap.js"></script>
  <script src="office.js"></script>
</body>
</html>
